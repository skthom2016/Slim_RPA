name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --logger trx
      - name: Validate JSON schemas
        run: |
          Get-ChildItem -Path src/Tracto.Contract.Schemas/schemas -Recurse -Filter *.json | ForEach-Object {
            $null = [System.Text.Json.JsonDocument]::Parse([System.IO.File]::ReadAllText($_.FullName))
            Write-Host "Valid JSON: $($_.Name)"
          }
        shell: pwsh
